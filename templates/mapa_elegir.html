<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Como llegar - Aspel SAE</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #222;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.1);
      padding: 26px 22px; max-width: 380px; width: 100%; text-align: center;
    }
    h1 { font-size: 1.05rem; color: #1a3a5c; margin-bottom: 6px; }
    .direccion { font-size: .85rem; color: #555; margin-bottom: 22px; line-height: 1.4; }
    .btn-app {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 10px;
      text-decoration: none; font-weight: 600; font-size: .95rem; color: #fff;
    }
    .btn-google { background: #4285f4; }
    .btn-google:hover { background: #3367d6; }
    .btn-waze { background: #33ccff; color: #1a3a5c; }
    .btn-waze:hover { background: #1fb8ea; }
    .icono { font-size: 1.2rem; }
  </style>
</head>
<body>

  <div class="card">
    <h1>¿Cómo quieres llegar?</h1>
    <div class="direccion">{{ direccion }}</div>

    <a class="btn-app btn-google" href="{{ urls.google }}">
      <span class="icono">📍</span> Abrir en Google Maps
    </a>
    <a class="btn-app btn-waze" href="{{ urls.waze }}">
      <span class="icono">🚗</span> Abrir en Waze
    </a>
  </div>

</body>
</html>
