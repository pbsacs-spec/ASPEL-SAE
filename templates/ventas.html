<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ventas - Aspel SAE</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #222; }

    header {
      background: #1a3a5c; color: #fff;
      padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 8px;
    }
    header h1 { font-size: 1.05rem; font-weight: 600; }
    .nav-links { display: flex; gap: 18px; flex-wrap: wrap; }
    .nav-links a { color: #9bbfe0; font-size: .82rem; text-decoration: none; }
    .nav-links a:hover { color: #fff; }

    .page { max-width: 1100px; margin: 20px auto; padding: 0 16px; display: grid; gap: 16px; }

    .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.09); overflow: hidden; }
    .card-hdr {
      background: #f7f9fc; border-bottom: 1px solid #e0e4ea;
      padding: 11px 18px; font-weight: 600; font-size: .9rem; color: #1a3a5c;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    }
    .card-body { padding: 18px; }

    .filtros {
      display: flex; gap: 12px; flex-wrap: wrap; align-items: end;
    }
    .fg { display: flex; flex-direction: column; gap: 4px; min-width: 140px; }
    .fg label { font-size: .78rem; font-weight: 600; color: #555; }
    .fg select, .fg input {
      padding: 7px 10px; border: 1px solid #cdd1d9; border-radius: 6px; font-size: .87rem;
    }
    #empresa-wrap { display: none; }

    .btn {
      padding: 7px 16px; border: none; border-radius: 6px;
      font-size: .83rem; font-weight: 600; cursor: pointer; background: #1a3a5c; color: #fff;
    }
    .btn:hover { opacity: .85; }
    .btn-outline {
      background: transparent; color: #1a3a5c; border: 1px solid #1a3a5c;
      font-size: .78rem; padding: 5px 11px;
    }
    .btn-outline.active { background: #1a3a5c; color: #fff; }
    .btn-excel { background: #1e7e34; }
    .btn-pdf   { background: #b02020; }
    .btn-sm { padding: 5px 12px; font-size: .78rem; }

    .resumen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    @media (max-width: 640px) { .resumen { grid-template-columns: 1fr; } }
    .stat { background: #f7f9fc; border-radius: 8px; padding: 14px 16px; text-align: center; }
    .stat .num { font-size: 1.4rem; font-weight: 700; color: #1a3a5c; }
    .stat .lbl { font-size: .78rem; color: #777; margin-top: 2px; }

    .chart-wrap { position: relative; height: 320px; }

    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th { background: #f7f9fc; padding: 9px 12px; text-align: left; font-weight: 600;
         color: #555; border-bottom: 2px solid #e0e4ea; cursor: pointer; white-space: nowrap; }
    th.num, td.num { text-align: right; }
    td { padding: 9px 12px; border-bottom: 1px solid #eee; }
    tr:hover td { background: #f9fbff; }
    .tipo-badge {
      display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: .72rem; font-weight: 600;
    }
    .tipo-Producto { background: #eef2f7; color: #1a3a5c; }
    .tipo-Servicio { background: #fff3d6; color: #8a6200; }
    .tipo-Kit      { background: #eafaf1; color: #1e8449; }

    .empty { text-align: center; color: #999; padding: 40px; font-size: .9rem; }
    .error-msg { text-align: center; color: #b02020; padding: 40px; font-size: .9rem; }

    .table-scroll { overflow-x: auto; }

    .tabs { display: flex; gap: 4px; }
    .tab-btn {
      padding: 9px 18px; border: none; background: transparent; cursor: pointer;
      font-size: .87rem; font-weight: 600; color: #667; border-bottom: 3px solid transparent;
    }
    .tab-btn.active { color: #1a3a5c; border-bottom-color: #1a3a5c; }

    #mapaContenedor {
      height: 520px; border-radius: 8px; background: #eef2f7;
    }
    .leyenda { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: .78rem; color: #666; }
    .leyenda-barra {
      flex: 1; max-width: 260px; height: 10px; border-radius: 5px;
      background: linear-gradient(90deg, #deebf7, #1a3a5c);
    }
    .mapa-nota { font-size: .78rem; color: #888; margin-top: 8px; }
    .leaflet-tooltip { font-size: .8rem; }
  </style>
  <link rel="stylesheet" href="/static/vendor/leaflet.css">
</head>
<body>

<header>
  <h1>Ventas &mdash; Aspel SAE</h1>
  <div class="nav-links">
    <a href="/">Inventario</a>
    {% if es_admin %}
    <a href="/admin/database">Base de datos</a>
    <a href="/admin/whatsapp">WhatsApp</a>
    <a href="/admin/usuarios">Cuentas</a>
    {% endif %}
  </div>
</header>

<div class="page">

  <div class="card">
    <div class="card-body">
      <div class="filtros">
        <div class="fg" id="empresa-wrap">
          <label>Empresa</label>
          <select id="empresa" onchange="cargarAnios()"></select>
        </div>
        <div class="fg">
          <label>Ano</label>
          <select id="anio" onchange="cargar()"></select>
        </div>
        <div class="fg">
          <label>Mes</label>
          <select id="mes" onchange="cargar()">
            <option value="">Todo el ano</option>
            <option value="1">Enero</option>
            <option value="2">Febrero</option>
            <option value="3">Marzo</option>
            <option value="4">Abril</option>
            <option value="5">Mayo</option>
            <option value="6">Junio</option>
            <option value="7">Julio</option>
            <option value="8">Agosto</option>
            <option value="9">Septiembre</option>
            <option value="10">Octubre</option>
            <option value="11">Noviembre</option>
            <option value="12">Diciembre</option>
          </select>
        </div>
        <div class="fg">
          <label>Tipo</label>
          <select id="tipo" onchange="cargar()">
            <option value="">Todos</option>
            <option value="P">Productos</option>
            <option value="S">Servicios</option>
            <option value="K">Kits</option>
          </select>
        </div>
        <button class="btn" onclick="cargar()">Actualizar</button>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabBtnResumen" onclick="mostrarTab('resumen')">Resumen</button>
    <button class="tab-btn" id="tabBtnMapa" onclick="mostrarTab('mapa')">Mapa</button>
  </div>

  <div id="tabResumen">
    <div id="contenedor">
      <div class="empty">Cargando...</div>
    </div>
  </div>

  <div id="tabMapa" style="display:none">
    <div class="card">
      <div class="card-hdr">
        <span id="mapaTitulo">México</span>
        <button class="btn-outline btn-sm" id="btnVolverMexico" style="display:none" onclick="volverAMexico()">&larr; Volver a México</button>
      </div>
      <div class="card-body">
        <div id="mapaContenedor"></div>
        <div class="leyenda">
          <span>$0</span>
          <div class="leyenda-barra"></div>
          <span id="leyendaMax">$0</span>
        </div>
        <div class="mapa-nota" id="mapaNota"></div>
      </div>
    </div>

    <div class="card" id="cardProductosMapa" style="display:none">
      <div class="card-hdr">
        <span id="productosMapaTitulo">Mas vendidos</span>
      </div>
      <div class="table-scroll" id="productosMapaTabla"></div>
    </div>
  </div>

</div>

<script src="/static/vendor/chart.min.js"></script>
<script src="/static/vendor/xlsx.full.min.js"></script>
<script src="/static/vendor/jspdf.umd.min.js"></script>
<script src="/static/vendor/jspdf.plugin.autotable.min.js"></script>
<script src="/static/vendor/leaflet.js"></script>
<script>
  const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  let filas = [];
  let sortCol = 'importe', sortDir = -1;
  let modoChart = 'importe';
  let chartTop = null, chartMes = null;

  // ── Mapa ──────────────────────────────────────────────────────
  let tabActual = 'resumen';
  let datosMapa = null;
  let estadosGeoJSON = null;
  let mapaLeaflet = null, capaEstados = null, capaMunicipios = null;
  let municipiosCache = {};
  let estadoActual = null;

  const fmt  = v => Number(v).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtP = v => '$' + fmt(v);
  const escH = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  function empresaActual() {
    const sel = document.getElementById('empresa');
    return sel ? sel.value : '';
  }

  fetch('/api/empresas').then(r => r.json()).then(er => {
    const sel = document.getElementById('empresa');
    if (er.ok && er.data.length > 1) {
      sel.innerHTML = er.data.map(e => `<option value="${e.id}">${escH(e.nombre)}</option>`).join('');
      sel.value = er.default;
      document.getElementById('empresa-wrap').style.display = 'flex';
    }
    cargarAnios();
  }).catch(cargarAnios);

  async function cargarAnios() {
    const sel = document.getElementById('anio');
    try {
      const qs = empresaActual() ? ('?empresa=' + empresaActual()) : '';
      const r = await fetch('/api/ventas/anios' + qs).then(r => r.json());
      const anioActual = new Date().getFullYear();
      let anios = (r.ok && r.data.length) ? r.data : [anioActual];
      if (!anios.includes(anioActual)) anios = [anioActual, ...anios];
      sel.innerHTML = anios.map(a => `<option value="${a}">${a}</option>`).join('');
      cargar();
    } catch (e) {
      sel.innerHTML = `<option value="${new Date().getFullYear()}">${new Date().getFullYear()}</option>`;
      cargar();
    }
  }

  async function cargar() {
    const anio    = document.getElementById('anio').value;
    const mes     = document.getElementById('mes').value;
    const tipo    = document.getElementById('tipo').value;
    const empresa = empresaActual();

    document.getElementById('contenedor').innerHTML = '<div class="empty">Consultando...</div>';

    try {
      const p = new URLSearchParams({ anio, mes, tipo });
      if (empresa) p.set('empresa', empresa);
      const res = await fetch('/api/ventas?' + p).then(r => r.json());
      if (!res.ok) {
        document.getElementById('contenedor').innerHTML = `<div class="error-msg">Error: ${res.error}</div>`;
        return;
      }
      filas = res.data;
      renderTodo(res.resumen, res.por_mes, !mes);
    } catch (e) {
      document.getElementById('contenedor').innerHTML = `<div class="error-msg">Error de conexion: ${e.message}</div>`;
    }

    cargarMapa();
  }

  // ── Pestanas ──────────────────────────────────────────────────
  function mostrarTab(tab) {
    tabActual = tab;
    document.getElementById('tabResumen').style.display = tab === 'resumen' ? 'block' : 'none';
    document.getElementById('tabMapa').style.display = tab === 'mapa' ? 'block' : 'none';
    document.getElementById('tabBtnResumen').classList.toggle('active', tab === 'resumen');
    document.getElementById('tabBtnMapa').classList.toggle('active', tab === 'mapa');
    if (tab === 'mapa' && mapaLeaflet) {
      setTimeout(() => {
        mapaLeaflet.invalidateSize();
        const capa = capaMunicipios || capaEstados;
        if (capa) mapaLeaflet.fitBounds(capa.getBounds());
      }, 50);
    }
  }

  // ── Mapa ──────────────────────────────────────────────────────
  async function cargarMapa() {
    const anio    = document.getElementById('anio').value;
    const mes     = document.getElementById('mes').value;
    const tipo    = document.getElementById('tipo').value;
    const empresa = empresaActual();

    try {
      const p = new URLSearchParams({ anio, mes, tipo });
      if (empresa) p.set('empresa', empresa);
      const res = await fetch('/api/ventas/mapa?' + p).then(r => r.json());
      if (!res.ok) return;
      datosMapa = res;
      volverAMexico(true);
      await initMapa();
      redibujarEstados();
    } catch (e) {
      // el resumen ya muestra el error principal; el mapa simplemente no se actualiza
    }
  }

  async function initMapa() {
    if (mapaLeaflet) return;
    mapaLeaflet = L.map('mapaContenedor', { zoomControl: true, attributionControl: false });
    if (!estadosGeoJSON) {
      estadosGeoJSON = await fetch('/static/vendor/geo/estados.json').then(r => r.json());
    }
  }

  function colorEscala(valor, max) {
    if (!max || valor <= 0) return '#eef2f7';
    const t = Math.min(valor / max, 1);
    const c1 = [222, 235, 247], c2 = [26, 58, 92];
    const rgb = c1.map((c, i) => Math.round(c + (c2[i] - c) * t));
    return `rgb(${rgb.join(',')})`;
  }

  function redibujarEstados() {
    if (!mapaLeaflet || !estadosGeoJSON || !datosMapa) return;
    if (capaMunicipios) { mapaLeaflet.removeLayer(capaMunicipios); capaMunicipios = null; }
    if (capaEstados) mapaLeaflet.removeLayer(capaEstados);

    const porId = {};
    datosMapa.por_estado.forEach(e => porId[e.id] = e);
    const max = Math.max(0, ...datosMapa.por_estado.map(e => e.importe));
    document.getElementById('leyendaMax').textContent = fmtP(max);
    actualizarNota();

    capaEstados = L.geoJSON(estadosGeoJSON, {
      style: feat => ({
        fillColor: colorEscala((porId[feat.properties.id] || {}).importe || 0, max),
        weight: 1, color: '#fff', fillOpacity: .88,
      }),
      onEachFeature: (feat, layer) => {
        const info = porId[feat.properties.id];
        const importe = info ? info.importe : 0;
        const clientes = info ? info.num_clientes : 0;
        layer.bindTooltip(
          `<strong>${escH(feat.properties.name)}</strong><br>${fmtP(importe)} &middot; ${clientes} cliente(s)`,
          { sticky: true }
        );
        layer.on('mouseover', () => layer.setStyle({ weight: 2, color: '#1a3a5c' }));
        layer.on('mouseout', () => capaEstados.resetStyle(layer));
        layer.on('click', () => verMunicipios(feat.properties.id, feat.properties.name));
      }
    }).addTo(mapaLeaflet);

    try { mapaLeaflet.fitBounds(capaEstados.getBounds()); } catch (e) {}
    ocultarProductosMapa();
  }

  async function verMunicipios(id, nombre) {
    if (!datosMapa) return;
    estadoActual = id;
    document.getElementById('mapaTitulo').textContent = nombre;
    document.getElementById('btnVolverMexico').style.display = 'inline-block';

    if (capaEstados) { mapaLeaflet.removeLayer(capaEstados); capaEstados = null; }
    if (capaMunicipios) { mapaLeaflet.removeLayer(capaMunicipios); capaMunicipios = null; }

    if (!municipiosCache[id]) {
      try {
        municipiosCache[id] = await fetch(`/static/vendor/geo/municipios/${id}.json`).then(r => r.json());
      } catch (e) {
        document.getElementById('mapaNota').textContent = 'No se pudo cargar el detalle de municipios.';
        return;
      }
    }
    const geo = municipiosCache[id];
    const lista = (datosMapa.por_municipio[id] || []);
    const porNombre = {};
    lista.forEach(m => porNombre[m.nombre] = m);
    const max = Math.max(0, ...lista.map(m => m.importe));
    document.getElementById('leyendaMax').textContent = fmtP(max);
    actualizarNota(id);

    capaMunicipios = L.geoJSON(geo, {
      style: feat => ({
        fillColor: colorEscala((porNombre[feat.properties.NAME_2] || {}).importe || 0, max),
        weight: 1, color: '#fff', fillOpacity: .88,
      }),
      onEachFeature: (feat, layer) => {
        const info = porNombre[feat.properties.NAME_2];
        const importe = info ? info.importe : 0;
        const clientes = info ? info.num_clientes : 0;
        layer.bindTooltip(
          `<strong>${escH(feat.properties.NAME_2)}</strong><br>${fmtP(importe)} &middot; ${clientes} cliente(s)`,
          { sticky: true }
        );
        layer.on('mouseover', () => layer.setStyle({ weight: 2, color: '#1a3a5c' }));
        layer.on('mouseout', () => capaMunicipios.resetStyle(layer));
        layer.on('click', () => mostrarProductosMapa(feat.properties.NAME_2, info));
      }
    }).addTo(mapaLeaflet);

    try { mapaLeaflet.fitBounds(capaMunicipios.getBounds()); } catch (e) {}

    const infoEstado = datosMapa.por_estado.find(e => e.id === id);
    mostrarProductosMapa(nombre, infoEstado);
  }

  function volverAMexico(silencioso) {
    estadoActual = null;
    document.getElementById('mapaTitulo').textContent = 'México';
    document.getElementById('btnVolverMexico').style.display = 'none';
    if (capaMunicipios && mapaLeaflet) { mapaLeaflet.removeLayer(capaMunicipios); capaMunicipios = null; }
    if (!silencioso) redibujarEstados();
    ocultarProductosMapa();
  }

  function ocultarProductosMapa() {
    document.getElementById('cardProductosMapa').style.display = 'none';
  }

  function mostrarProductosMapa(nombre, info) {
    const card = document.getElementById('cardProductosMapa');
    const productos = info ? info.productos : [];
    if (!productos || !productos.length) {
      document.getElementById('productosMapaTitulo').textContent = `Sin ventas en ${nombre}`;
      document.getElementById('productosMapaTabla').innerHTML = '<div class="empty">Sin datos.</div>';
      card.style.display = 'block';
      return;
    }
    document.getElementById('productosMapaTitulo').textContent =
      `Mas vendidos en ${nombre} (top ${productos.length})`;
    let html = `<table><thead><tr>
      <th>Clave</th><th>Descripcion</th><th>Tipo</th>
      <th class="num">Cantidad</th><th class="num">Importe</th><th class="num">Ventas</th>
    </tr></thead><tbody>`;
    productos.forEach(p => {
      html += `<tr>
        <td><strong>${escH(p.cve_art)}</strong></td>
        <td>${escH(p.descr)}</td>
        <td><span class="tipo-badge tipo-${p.tipo}">${p.tipo}</span></td>
        <td class="num">${fmt(p.cantidad)}</td>
        <td class="num">${fmtP(p.importe)}</td>
        <td class="num">${p.num_ventas}</td>
      </tr>`;
    });
    html += '</tbody></table>';
    document.getElementById('productosMapaTabla').innerHTML = html;
    card.style.display = 'block';
  }

  function actualizarNota(estadoId) {
    const nota = document.getElementById('mapaNota');
    if (!datosMapa) { nota.textContent = ''; return; }
    if (estadoId) {
      const lista = datosMapa.por_municipio[estadoId] || [];
      const sinId = lista.find(m => m.nombre === 'No identificado');
      nota.textContent = sinId
        ? `${fmtP(sinId.importe)} sin municipio identificado en este estado (${sinId.num_ventas} venta(s)).`
        : '';
      return;
    }
    const si = datosMapa.sin_identificar;
    nota.textContent = (si && si.importe > 0)
      ? `${fmtP(si.importe)} sin estado identificado (${si.num_ventas} venta(s), revisa el domicilio del cliente en Aspel).`
      : '';
  }

  function renderTodo(resumen, porMes, mostrarMensual) {
    const cont = document.getElementById('contenedor');

    if (!filas.length) {
      cont.innerHTML = '<div class="card"><div class="empty">Sin ventas en el periodo seleccionado.</div></div>';
      return;
    }

    cont.innerHTML = `
      <div class="card">
        <div class="card-body">
          <div class="resumen">
            <div class="stat"><div class="num">${fmtP(resumen.importe_total)}</div><div class="lbl">Total vendido</div></div>
            <div class="stat"><div class="num">${fmt(resumen.cantidad_total)}</div><div class="lbl">Unidades / servicios vendidos</div></div>
            <div class="stat"><div class="num">${resumen.num_productos}</div><div class="lbl">Productos/servicios distintos</div></div>
          </div>
        </div>
      </div>

      ${mostrarMensual ? `
      <div class="card">
        <div class="card-hdr">Ventas por mes</div>
        <div class="card-body"><div class="chart-wrap"><canvas id="chartMes"></canvas></div></div>
      </div>` : ''}

      <div class="card">
        <div class="card-hdr">
          Mas vendidos
          <div>
            <button class="btn-outline btn-sm ${modoChart==='importe'?'active':''}" onclick="cambiarModoChart('importe', this)">Por importe</button>
            <button class="btn-outline btn-sm ${modoChart==='cantidad'?'active':''}" onclick="cambiarModoChart('cantidad', this)">Por cantidad</button>
          </div>
        </div>
        <div class="card-body"><div class="chart-wrap"><canvas id="chartTop"></canvas></div></div>
      </div>

      <div class="card">
        <div class="card-hdr">
          Detalle (${filas.length})
          <div>
            <button class="btn btn-excel btn-sm" onclick="exportarExcel()">Excel</button>
            <button class="btn btn-pdf btn-sm" onclick="exportarPDF()">PDF</button>
          </div>
        </div>
        <div class="table-scroll">${tablaHtml()}</div>
      </div>
    `;

    dibujarChartTop();
    if (mostrarMensual) dibujarChartMes(porMes);
  }

  function tablaHtml() {
    const ordenadas = [...filas].sort((a, b) => {
      const va = a[sortCol], vb = b[sortCol];
      if (typeof va === 'string') return va.localeCompare(vb) * sortDir;
      return (va - vb) * sortDir;
    });
    let html = `<table><thead><tr>
      <th onclick="ordenar('cve_art')">Clave</th>
      <th onclick="ordenar('descr')">Descripcion</th>
      <th onclick="ordenar('lin_prod')">Linea</th>
      <th onclick="ordenar('tipo')">Tipo</th>
      <th class="num" onclick="ordenar('cantidad')">Cantidad</th>
      <th class="num" onclick="ordenar('importe')">Importe</th>
      <th class="num" onclick="ordenar('num_ventas')">Ventas</th>
    </tr></thead><tbody>`;
    ordenadas.forEach(r => {
      html += `<tr>
        <td><strong>${escH(r.cve_art)}</strong></td>
        <td>${escH(r.descr)}</td>
        <td>${escH(r.lin_prod)}</td>
        <td><span class="tipo-badge tipo-${r.tipo}">${r.tipo}</span></td>
        <td class="num">${fmt(r.cantidad)}</td>
        <td class="num">${fmtP(r.importe)}</td>
        <td class="num">${r.num_ventas}</td>
      </tr>`;
    });
    html += '</tbody></table>';
    return html;
  }

  function ordenar(col) {
    sortDir = (sortCol === col) ? -sortDir : -1;
    sortCol = col;
    document.querySelector('.table-scroll').innerHTML = tablaHtml();
  }

  function cambiarModoChart(modo, btn) {
    modoChart = modo;
    document.querySelectorAll('.card-hdr .btn-outline').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    dibujarChartTop();
  }

  function dibujarChartTop() {
    const top = [...filas].sort((a, b) => b[modoChart] - a[modoChart]).slice(0, 15);
    const ctx = document.getElementById('chartTop');
    if (!ctx) return;
    if (chartTop) chartTop.destroy();
    chartTop = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: top.map(r => r.cve_art),
        datasets: [{
          label: modoChart === 'importe' ? 'Importe ($)' : 'Cantidad',
          data: top.map(r => r[modoChart]),
          backgroundColor: '#1a3a5c',
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              afterTitle: (items) => {
                const r = top[items[0].dataIndex];
                return r.descr;
              }
            }
          }
        },
        scales: { x: { beginAtZero: true } }
      }
    });
  }

  function dibujarChartMes(porMes) {
    const ctx = document.getElementById('chartMes');
    if (!ctx) return;
    if (chartMes) chartMes.destroy();
    chartMes = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: MESES,
        datasets: [{ label: 'Ventas ($)', data: porMes, backgroundColor: '#245080' }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true } }
      }
    });
  }

  // ── Exportar ──────────────────────────────────────────────────
  function datosExport() {
    const cabeceras = ['Clave', 'Descripcion', 'Linea', 'Tipo', 'Cantidad', 'Importe', 'Ventas'];
    const cuerpo = [...filas].sort((a, b) => b.importe - a.importe).map(r => [
      r.cve_art, r.descr, r.lin_prod, r.tipo, r.cantidad, r.importe, r.num_ventas
    ]);
    return { cabeceras, cuerpo };
  }

  function nombreArchivo(ext) {
    const anio = document.getElementById('anio').value;
    const mes  = document.getElementById('mes').value;
    return `ventas_${anio}${mes ? '_' + mes : ''}.${ext}`;
  }

  function exportarExcel() {
    if (typeof XLSX === 'undefined') { alert('Libreria cargando, reintenta.'); return; }
    const { cabeceras, cuerpo } = datosExport();
    const hoja = XLSX.utils.aoa_to_sheet([cabeceras, ...cuerpo]);
    hoja['!cols'] = [{wch:16},{wch:42},{wch:14},{wch:10},{wch:12},{wch:14},{wch:10}];
    const libro = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(libro, hoja, 'Ventas');
    XLSX.writeFile(libro, nombreArchivo('xlsx'));
  }

  function exportarPDF() {
    if (typeof window.jspdf === 'undefined') { alert('Libreria cargando, reintenta.'); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'letter' });
    const { cabeceras, cuerpo } = datosExport();
    doc.setFontSize(13); doc.setTextColor(26,58,92);
    doc.text('Reporte de Ventas - Aspel SAE', 14, 14);
    doc.autoTable({
      head: [cabeceras], body: cuerpo, startY: 20,
      styles: { fontSize: 8 },
      headStyles: { fillColor: [26,58,92], textColor: 255 },
    });
    doc.save(nombreArchivo('pdf'));
  }
</script>

</html>
