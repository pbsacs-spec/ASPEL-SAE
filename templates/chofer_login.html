<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mi ruta - Aspel SAE</title>
  <meta name="theme-color" content="#1a3a5c">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #222;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .card {
      background: #fff; border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.1);
      width: 100%; max-width: 360px; padding: 32px 26px; text-align: center;
    }
    .icono { font-size: 2.6rem; margin-bottom: 10px; }
    h1 { font-size: 1.2rem; color: #1a3a5c; margin-bottom: 6px; }
    .sub { font-size: .85rem; color: #777; margin-bottom: 24px; }
    input#pin {
      width: 100%; padding: 16px; border: 2px solid #cdd1d9; border-radius: 10px;
      font-size: 1.8rem; text-align: center; letter-spacing: .4em; margin-bottom: 16px;
    }
    input#pin:focus { outline: none; border-color: #1a3a5c; }
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      font-size: 1rem; font-weight: 700; cursor: pointer; background: #1a3a5c; color: #fff;
    }
    .btn:hover { opacity: .9; }
    .msg-err { color: #b02020; font-weight: 600; font-size: .88rem; margin-bottom: 14px; }
  </style>
</head>
<body>

<div class="card">
  <div class="icono">🚚</div>
  <h1>Mi ruta de entregas</h1>
  <p class="sub">Escribe tu PIN para ver los paquetes que te tocan hoy.</p>

  {% if error %}<p class="msg-err">{{ error }}</p>{% endif %}

  <form method="POST" action="/chofer/login">
    <input type="password" name="pin" id="pin" inputmode="numeric" pattern="[0-9]*"
           maxlength="6" autocomplete="off" autofocus required>
    <button type="submit" class="btn">Entrar</button>
  </form>
</div>

</body>
</html>
