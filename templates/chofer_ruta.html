<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mi ruta - Aspel SAE</title>
  <link rel="manifest" href="/static/chofer/manifest.json">
  <meta name="theme-color" content="#1a3a5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/static/chofer/icons/icon-192.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #222; padding-bottom: 24px; }

    header {
      background: #1a3a5c; color: #fff; padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .chofer-nombre { font-weight: 700; font-size: 1rem; }
    .sync-estado { font-size: .78rem; color: #ffd27a; min-height: 1em; }
    .header-acciones { display: flex; gap: 8px; }

    .btn-chip {
      padding: 7px 13px; border-radius: 20px; border: none; font-size: .82rem;
      font-weight: 600; cursor: pointer; background: rgba(255,255,255,.15); color: #fff; text-decoration: none;
    }
    .btn-chip-primary { background: #1a7f3c; color: #fff; }
    .btn-chip:disabled { opacity: .5; cursor: not-allowed; }

    .toolbar { padding: 12px 16px 0; display: flex; justify-content: flex-end; }
    .toolbar button { background: #fff; color: #1a3a5c; border: 1px solid #cdd1d9; }

    .lista { padding: 12px 16px; display: grid; gap: 12px; }
    .vacio { text-align: center; color: #888; padding: 40px 0; font-size: .9rem; }

    .tarjeta { background: #fff; border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,.08); padding: 14px 16px; }
    .tarjeta-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .tarjeta-folio { font-size: .78rem; font-weight: 700; color: #1a3a5c; text-transform: uppercase; }
    .badge-pendiente { background: #fef3cd; color: #8a6d00; font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
    .tarjeta-nombre { font-size: 1.02rem; font-weight: 700; margin-bottom: 2px; }
    .tarjeta-dato { font-size: .84rem; color: #555; margin-bottom: 2px; }
    .tarjeta-acciones { display: flex; gap: 8px; margin-top: 12px; }
    .tarjeta-acciones .btn-chip { background: #eef1f5; color: #1a3a5c; flex: 1; text-align: center; }
    .tarjeta-acciones .btn-chip-primary { background: #1a7f3c; color: #fff; }

    .overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
      align-items: flex-end; justify-content: center; z-index: 50;
    }
    .overlay.show { display: flex; }
    .overlay .card {
      background: #fff; border-radius: 16px 16px 0 0; width: 100%; max-width: 480px;
      max-height: 92vh; overflow-y: auto; padding: 22px 20px 26px; text-align: left;
    }
    .overlay h1 { font-size: 1.1rem; color: #1a3a5c; margin-bottom: 4px; }
    .overlay .sub { font-size: .85rem; color: #777; margin-bottom: 16px; }

    .firma-label, .fotos-label { font-size: .82rem; font-weight: 600; color: #333; margin-bottom: 6px; }
    .firma-wrap { position: relative; }
    #firmaCanvas { width: 100%; height: 150px; border: 2px dashed #cdd1d9; border-radius: 10px; touch-action: none; background: #fff; display: block; }
    #firmaPlaceholder { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #bbb; font-size: .85rem; pointer-events: none; }
    .firma-acciones { display: flex; justify-content: flex-end; margin: 6px 0 16px; }
    .btn-limpiar { background: none; border: none; color: #777; font-size: .8rem; cursor: pointer; text-decoration: underline; }

    .fotos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .foto-slot {
      position: relative; aspect-ratio: 1; border: 2px dashed #cdd1d9; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      background: #f7f9fc; cursor: pointer; color: #999; font-size: 1.5rem;
    }
    .foto-slot img { width: 100%; height: 100%; object-fit: contain; }
    .foto-slot .quitar {
      position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; border-radius: 50%;
      background: rgba(0,0,0,.6); color: #fff; border: none; font-size: .85rem; line-height: 1; cursor: pointer;
    }
    .foto-slot input { display: none; }

    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      font-size: 1rem; font-weight: 700; cursor: pointer; background: #1a7f3c; color: #fff; margin-bottom: 8px;
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-secondary { background: #eef1f5; color: #333; }
    .msg-err { color: #b02020; font-weight: 600; font-size: .85rem; margin-top: 8px; }
  </style>
</head>
<body>

<header>
  <div>
    <div class="chofer-nombre">{{ chofer.nombre }}</div>
    <div class="sync-estado" id="syncEstado"></div>
  </div>
  <div class="header-acciones">
    <button id="btnInstalar" class="btn-chip" style="display:none;" onclick="instalar()">Instalar</button>
    <button class="btn-chip" onclick="cerrarSesion()">Salir</button>
  </div>
</header>

<div class="toolbar">
  <button class="btn-chip" onclick="actualizarRuta()">&#x21bb; Actualizar ruta</button>
</div>

<div id="lista" class="lista"><p class="vacio">Cargando...</p></div>

<div id="overlay" class="overlay">
  <div class="card">
    <h1>Confirmar entrega</h1>
    <p class="sub" id="modalSub"></p>

    <div class="firma-label">Firma de quien recibe</div>
    <div class="firma-wrap">
      <canvas id="firmaCanvas"></canvas>
      <div id="firmaPlaceholder">Firma aqui con el dedo</div>
    </div>
    <div class="firma-acciones">
      <button type="button" class="btn-limpiar" onclick="limpiarFirma()">Borrar firma</button>
    </div>

    <div class="fotos-label">Fotos de evidencia (opcional, hasta 3)</div>
    <div class="fotos-grid" id="fotosGrid">
      <label class="foto-slot" data-slot="0"><span class="mas">&#128247;</span><input type="file" accept="image/*" capture="environment" onchange="capturarFoto(this, 0)"></label>
      <label class="foto-slot" data-slot="1"><span class="mas">&#128247;</span><input type="file" accept="image/*" capture="environment" onchange="capturarFoto(this, 1)"></label>
      <label class="foto-slot" data-slot="2"><span class="mas">&#128247;</span><input type="file" accept="image/*" capture="environment" onchange="capturarFoto(this, 2)"></label>
    </div>

    <button class="btn" id="btnConfirmar" onclick="confirmarEntrega()" disabled>Confirmar entrega</button>
    <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
    <div id="resultado"></div>
  </div>
</div>

<form id="formLogout" method="POST" action="/chofer/logout" style="display:none;"></form>

<script>
  // ── IndexedDB: 'ruta' (ultima lista bajada del servidor) y 'cola_sync'
  // (confirmaciones hechas sin internet, pendientes de mandar) ─────────────
  const DB_NAME = 'chofer_rutas';
  const DB_VERSION = 1;

  function abrirDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('ruta')) db.createObjectStore('ruta', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('cola_sync')) db.createObjectStore('cola_sync', { keyPath: 'clave', autoIncrement: true });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function guardarRutaLocal(items) {
    const db = await abrirDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('ruta', 'readwrite');
      const store = tx.objectStore('ruta');
      store.clear();
      for (const item of items) store.put(item);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function leerRutaLocal() {
    const db = await abrirDB();
    return new Promise((resolve, reject) => {
      const req = db.transaction('ruta', 'readonly').objectStore('ruta').getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function quitarDeRutaLocal(id) {
    const db = await abrirDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('ruta', 'readwrite');
      tx.objectStore('ruta').delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function encolarConfirmacion(embarqueId, payload) {
    const db = await abrirDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('cola_sync', 'readwrite');
      tx.objectStore('cola_sync').add({ embarqueId, payload, ts: Date.now() });
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function leerCola() {
    const db = await abrirDB();
    return new Promise((resolve, reject) => {
      const req = db.transaction('cola_sync', 'readonly').objectStore('cola_sync').getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  // ── Service worker + sincronizacion ──────────────────────────────────
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/chofer/sw.js').catch(() => {});
    navigator.serviceWorker.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'sync-ok') {
        pintarDesdeLocal();
      }
    });
  }

  function pedirSincronizar() {
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage({ type: 'sincronizar-ahora' });
    }
  }
  window.addEventListener('online', pedirSincronizar);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') pedirSincronizar();
  });

  // ── Instalar como app ────────────────────────────────────────────────
  let eventoInstalar = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    eventoInstalar = e;
    document.getElementById('btnInstalar').style.display = 'inline-block';
  });
  function instalar() {
    if (eventoInstalar) eventoInstalar.prompt();
  }

  function cerrarSesion() {
    document.getElementById('formLogout').submit();
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ── Cargar / pintar la ruta ───────────────────────────────────────────
  async function actualizarRuta() {
    try {
      const r = await fetch('/api/chofer/ruta');
      const data = await r.json();
      if (data.ok) await guardarRutaLocal(data.data);
    } catch (e) { /* sin señal: se queda con lo que ya habia guardado localmente */ }
    await pintarDesdeLocal();
  }

  async function pintarDesdeLocal() {
    const items = await leerRutaLocal();
    const cola = await leerCola();
    const pendientesIds = new Set(cola.map((c) => c.embarqueId));
    await actualizarEstadoSync(cola.length);

    const lista = document.getElementById('lista');
    if (!items.length) {
      lista.innerHTML = '<p class="vacio">No tienes entregas pendientes en tu ruta.</p>';
      return;
    }
    items.sort((a, b) => (a.fecha_embarque || '').localeCompare(b.fecha_embarque || ''));
    lista.innerHTML = items.map((e) => {
      const folio = `${e.factura_serie || ''}${e.factura_folio || ''}`;
      const pendienteSync = pendientesIds.has(e.id);
      const direccion = e.direccion_texto || '';
      const mapsUrl = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(direccion);
      return `
        <div class="tarjeta">
          <div class="tarjeta-top">
            <div class="tarjeta-folio">Factura ${esc(folio)}</div>
            ${pendienteSync ? '<span class="badge-pendiente">Falta sincronizar</span>' : ''}
          </div>
          <div class="tarjeta-nombre">${esc(e.dest_nombre)}</div>
          ${direccion ? `<div class="tarjeta-dato">${esc(direccion)}</div>` : ''}
          ${e.dest_telefono ? `<div class="tarjeta-dato">Tel: ${esc(e.dest_telefono)}</div>` : ''}
          <div class="tarjeta-dato">Bultos: ${esc(e.num_bultos || 1)}${e.empresa_nombre ? ' &middot; ' + esc(e.empresa_nombre) : ''}</div>
          <div class="tarjeta-acciones">
            <a class="btn-chip" href="${mapsUrl}" target="_blank" rel="noopener">Como llegar</a>
            <button class="btn-chip btn-chip-primary" onclick="abrirConfirmar(${e.id})" ${pendienteSync ? 'disabled' : ''}>
              ${pendienteSync ? 'Ya confirmada' : 'Confirmar entrega'}
            </button>
          </div>
        </div>`;
    }).join('');
  }

  async function actualizarEstadoSync(total) {
    document.getElementById('syncEstado').textContent = total ? `${total} entrega(s) sin sincronizar` : '';
  }

  // ── Modal: firma + fotos + GPS (mismo flujo que /entrega/<token>) ─────
  const canvas = document.getElementById('firmaCanvas');
  const ctx = canvas.getContext('2d');
  const placeholder = document.getElementById('firmaPlaceholder');
  const btnConfirmar = document.getElementById('btnConfirmar');
  let dibujando = false, tieneTrazo = false, embarqueActual = null;
  const fotosBase64 = [null, null, null];

  function ajustarCanvas() {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width) return;
    const ratio = window.devicePixelRatio || 1;
    const prev = tieneTrazo ? canvas.toDataURL() : null;
    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.strokeStyle = '#1a3a5c';
    if (prev) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height); img.src = prev; }
  }
  window.addEventListener('resize', ajustarCanvas);

  function posicion(ev) {
    const rect = canvas.getBoundingClientRect();
    const p = ev.touches ? ev.touches[0] : ev;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  }
  function iniciar(ev) { ev.preventDefault(); dibujando = true; placeholder.style.display = 'none'; const { x, y } = posicion(ev); ctx.beginPath(); ctx.moveTo(x, y); }
  function mover(ev) { if (!dibujando) return; ev.preventDefault(); const { x, y } = posicion(ev); ctx.lineTo(x, y); ctx.stroke(); if (!tieneTrazo) { tieneTrazo = true; btnConfirmar.disabled = false; } }
  function terminar() { dibujando = false; }
  canvas.addEventListener('mousedown', iniciar);
  canvas.addEventListener('mousemove', mover);
  window.addEventListener('mouseup', terminar);
  canvas.addEventListener('touchstart', iniciar, { passive: false });
  canvas.addEventListener('touchmove', mover, { passive: false });
  canvas.addEventListener('touchend', terminar);

  function limpiarFirma() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    tieneTrazo = false;
    btnConfirmar.disabled = true;
    placeholder.style.display = 'block';
  }

  async function redimensionarImagen(file, maxDim, calidad) {
    if (window.createImageBitmap) {
      try {
        const bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
        let { width, height } = bitmap;
        if (width > height && width > maxDim) { height *= maxDim / width; width = maxDim; }
        else if (height > maxDim) { width *= maxDim / height; height = maxDim; }
        const c = document.createElement('canvas');
        c.width = width; c.height = height;
        c.getContext('2d').drawImage(bitmap, 0, 0, width, height);
        bitmap.close();
        return c.toDataURL('image/jpeg', calidad);
      } catch (e) { /* cae al metodo de respaldo */ }
    }
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height *= maxDim / width; width = maxDim; }
        else if (height > maxDim) { width *= maxDim / height; height = maxDim; }
        const c = document.createElement('canvas');
        c.width = width; c.height = height;
        c.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(c.toDataURL('image/jpeg', calidad));
        URL.revokeObjectURL(img.src);
      };
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }

  async function capturarFoto(input, idx) {
    const file = input.files && input.files[0];
    if (!file) return;
    try {
      const dataUrl = await redimensionarImagen(file, 1280, 0.75);
      fotosBase64[idx] = dataUrl;
      const slot = document.querySelector(`.foto-slot[data-slot="${idx}"]`);
      slot.innerHTML = `<img src="${dataUrl}"><button type="button" class="quitar" onclick="quitarFoto(event, ${idx})">&times;</button>`;
    } catch (e) {
      alert('No se pudo procesar la foto, intenta de nuevo.');
    } finally {
      input.value = '';
    }
  }
  function quitarFoto(ev, idx) {
    ev.preventDefault(); ev.stopPropagation();
    fotosBase64[idx] = null;
    const slot = document.querySelector(`.foto-slot[data-slot="${idx}"]`);
    slot.innerHTML = `<span class="mas">&#128247;</span><input type="file" accept="image/*" capture="environment" onchange="capturarFoto(this, ${idx})">`;
  }
  function resetFotos() {
    for (let i = 0; i < 3; i++) {
      fotosBase64[i] = null;
      const slot = document.querySelector(`.foto-slot[data-slot="${i}"]`);
      slot.innerHTML = `<span class="mas">&#128247;</span><input type="file" accept="image/*" capture="environment" onchange="capturarFoto(this, ${i})">`;
    }
  }

  function obtenerUbicacion() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) { resolve(null); return; }
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, precision: pos.coords.accuracy }),
        () => resolve(null),
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
      );
    });
  }

  function abrirConfirmar(embarqueId) {
    embarqueActual = embarqueId;
    limpiarFirma();
    resetFotos();
    document.getElementById('resultado').innerHTML = '';
    btnConfirmar.textContent = 'Confirmar entrega';
    document.getElementById('overlay').classList.add('show');
    setTimeout(ajustarCanvas, 50);
  }
  function cerrarModal() {
    document.getElementById('overlay').classList.remove('show');
    embarqueActual = null;
  }

  function fetchConTimeout(url, opciones, ms) {
    const controlador = new AbortController();
    const id = setTimeout(() => controlador.abort(), ms);
    return fetch(url, Object.assign({}, opciones, { signal: controlador.signal })).finally(() => clearTimeout(id));
  }

  async function confirmarEntrega() {
    if (!tieneTrazo) { alert('Debes firmar antes de confirmar.'); return; }
    const id = embarqueActual;
    const res = document.getElementById('resultado');
    btnConfirmar.disabled = true;
    btnConfirmar.textContent = 'Obteniendo ubicacion...';
    const ubicacion = await obtenerUbicacion();
    const firma = canvas.toDataURL('image/png');
    const fotos = fotosBase64.filter((f) => f);
    const payload = { firma, fotos, ubicacion };

    btnConfirmar.textContent = 'Confirmando...';
    try {
      const r = await fetchConTimeout(`/api/chofer/entregas/${id}/confirmar`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      }, 6000);
      const data = await r.json();
      if (data.ok) {
        await quitarDeRutaLocal(id);
        cerrarModal();
        await pintarDesdeLocal();
        return;
      }
      res.innerHTML = `<p class="msg-err">${esc(data.error || 'No se pudo confirmar.')}</p>`;
      btnConfirmar.disabled = false;
      btnConfirmar.textContent = 'Confirmar entrega';
    } catch (e) {
      // Sin señal (o muy lenta): se guarda en el celular y se manda sola
      // en cuanto haya internet (ver sw.js / evento 'online' arriba).
      await encolarConfirmacion(id, payload);
      try {
        if ('serviceWorker' in navigator && 'SyncManager' in window) {
          const reg = await navigator.serviceWorker.ready;
          await reg.sync.register('sync-entregas');
        }
      } catch (e2) { /* sin Background Sync (ej. iOS): se sincroniza al volver a abrir con señal */ }
      cerrarModal();
      await pintarDesdeLocal();
    }
  }

  // ── Arranque ──────────────────────────────────────────────────────────
  pintarDesdeLocal();
  actualizarRuta();
</script>

</body>
</html>
